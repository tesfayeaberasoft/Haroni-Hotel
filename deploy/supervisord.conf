[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:frontend]
command=/usr/local/bin/node /opt/frontend/.output/server/index.mjs
directory=/opt/frontend/.output
environment=HOST="127.0.0.1",PORT="3000",NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=96"
autostart=true
autorestart=true
startsecs=2
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
